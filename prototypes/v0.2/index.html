<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>小萌宝 AnalPal · 肛管癌工作台原型 v0.1.1</title>
<meta name="description" content="肛管癌患者工作台交互原型：放化疗副作用、肛周皮肤、肠道与排粪、造口生活、复查准备。">
<meta name="robots" content="noindex">
<!-- 内联 favicon：file:// 或单目录静态托管时，缺 favicon 会留一条 404 -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%23ee7b1e'/%3E%3Ctext x='16' y='23' font-size='18' font-family='PingFang SC,Helvetica,sans-serif' font-weight='700' fill='%23fff' text-anchor='middle'%3E萌%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>
<a class="skip" href="#main">跳到主要内容</a>
<div class="prototype-bar"><span><b>交互原型 v0.1.1</b> · 患者资料均为模拟；临床试验为 ClinicalTrials.gov 登记摘录（状态未核实）</span><span>仅本页演示 · 刷新重置 · 未接入 DSH / AI</span></div>
<div class="workspace">
  <aside class="sidebar" aria-label="小萌宝业务导航">
    <div class="brand">
      <img src="assets/brand/analpal-logo.jpg" alt="小萌宝 AnalPal 标识" width="46" height="46">
      <div><strong>小萌宝</strong><span>AnalPal · 肛管癌工作台</span></div>
    </div>
    <button class="profile profile-btn" id="profile-btn" data-action="profiles" aria-label="切换演示档案">
      <div class="avatar" id="profile-avatar" aria-hidden="true">陈</div>
      <div><b id="profile-name">陈女士的资料</b><span id="profile-meta">54 岁 · 肛管鳞癌 ⅢB 期</span></div>
      <span class="profile-caret" aria-hidden="true">⌄</span>
    </button>
    <nav id="nav" aria-label="一级导航"></nav>
    <div class="sidebar-bottom"><span class="eyebrow">小 X 宝家族</span><p>把难受说清楚，<br>复查才有得聊。</p><button class="text-button" data-action="help">原型操作说明 ↗</button></div>
  </aside>
  <div class="work-area">
    <header class="topbar">
      <div class="breadcrumb">小萌宝工作台 <span>/</span> <b id="breadcrumb">看板</b></div>
      <div class="top-note" id="top-note">本机资料 · 不上传云端</div>
      <div class="top-actions">
        <button class="status" id="ready-store" data-action="open-store" aria-label="资料目录：已激活"><i></i><span>资料目录</span><b>已激活</b></button>
        <button class="status" id="agent-toggle" data-action="agent" aria-expanded="false" aria-label="AI 对话：点击打开右侧原生会话面板"><i class="grey"></i><span>AI 对话</span><b id="agent-state">未进入激活</b></button>
        <button data-action="settings" aria-label="打开设置：工作区目录、文档解析、临床数据库">设置</button>
        <button id="font-toggle" aria-pressed="false" title="切换大字">大字 Aa</button>
        <button class="ver-chip" id="ver-chip" data-action="about" aria-label="关于小萌宝：查看版本号与构建信息">v0.1.1</button>
      </div>
    </header>
    <div class="work-grid" id="work-grid">
      <main id="main" tabindex="-1"></main>
      <aside class="agent-dock" id="agent-dock" aria-label="AI 原生会话面板" hidden>
        <div class="agent-head">
          <span class="dot" id="agent-dot"></span><b>AI 对话</b>
          <div class="spacer"></div>
          <div class="agent-sizes" role="group" aria-label="面板宽度">
            <button data-action="agent-size" data-size="narrow" aria-pressed="false" title="窄">窄</button>
            <button data-action="agent-size" data-size="std" aria-pressed="true" title="标准">标准</button>
            <button data-action="agent-size" data-size="wide" aria-pressed="false" title="宽">宽</button>
          </div>
          <button class="icon-button" data-action="agent" aria-label="隐藏 AI 对话面板" title="隐藏">×</button>
        </div>
        <div class="agent-body" id="agent-body"></div>
        <div class="agent-foot">
          <button class="primary" data-action="agent-build">整理本页要点</button>
          <button data-action="agent-copy">复制为提问草稿</button>
        </div>
      </aside>
    </div>
    <footer class="footer">小萌宝 · 与肛管癌患者和照护者一起整理、理解、准备沟通 <span class="ver-line"><b id="app-version">v0.1.1</b><em id="app-build">2026-10-21</em></span></footer>
  </div>
</div>
<dialog id="dialog" aria-labelledby="dialog-title">
  <div class="dialog-head"><div><span class="eyebrow" id="dialog-eyebrow">小萌宝</span><h2 id="dialog-title"></h2></div><button class="icon-button" data-action="close" aria-label="关闭弹窗">×</button></div>
  <div class="dialog-body" id="dialog-body"></div>
  <div class="dialog-foot" id="dialog-foot"></div>
</dialog>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="demo-data.js"></script>
<script src="trials-data.js"></script>
<script src="app.js"></script>
</body>
</html>
